<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="手繪示意地圖：元朗一帶約 800 米模糊範圍，虛線圓圈只作示意，並非 GPS 定位">
  <title>元朗・約 800 米模糊範圍示意圖</title>
  <defs>
    <!-- 紙質米白底 -->
    <linearGradient id="mapPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F3E7"/>
      <stop offset="1" stop-color="#EFEAD9"/>
    </linearGradient>
    <!-- 模糊範圍的水彩綠暈 -->
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6E9C78" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#86AD8D" stop-opacity="0.38"/>
      <stop offset="78%" stop-color="#AECBB2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#AECBB2" stop-opacity="0"/>
    </radialGradient>
    <filter id="mapBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="mapSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- 底紙 -->
  <rect width="720" height="400" fill="url(#mapPaper)"/>

  <!-- 水彩田野／山體色塊（純裝飾、不對應真實地理） -->
  <g filter="url(#mapSoft)" opacity="0.8">
    <path d="M-10,60 C90,20 180,50 260,20 C360,-14 470,30 560,8 C640,-10 700,24 730,10 L730,110 C620,90 520,120 420,100 C300,76 180,116 60,96 C20,89 -6,78 -10,72 Z"
          fill="#C9DCC6"/>
    <path d="M-10,300 C110,270 200,310 320,286 C450,260 560,300 730,272 L730,420 L-10,420 Z"
          fill="#BFD6BC" opacity="0.75"/>
    <ellipse cx="118" cy="330" rx="120" ry="46" fill="#AECBB2" opacity="0.5"/>
    <ellipse cx="612" cy="120" rx="120" ry="52" fill="#C2D8BE" opacity="0.55"/>
    <ellipse cx="600" cy="300" rx="90" ry="40" fill="#A9C7AB" opacity="0.4"/>
  </g>

  <!-- 河流（抽象淺藍色帶） -->
  <path d="M150,-20 C170,60 120,110 180,170 C240,230 190,290 250,420"
        fill="none" stroke="#AFCDE0" stroke-width="26" stroke-linecap="round"
        opacity="0.65" filter="url(#mapSoft)"/>
  <path d="M150,-20 C170,60 120,110 180,170 C240,230 190,290 250,420"
        fill="none" stroke="#93B9D6" stroke-width="6" stroke-linecap="round"
        opacity="0.5" stroke-dasharray="2 14"/>

  <!-- 抽象道路網（不對應真實街道） -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M-10,150 C120,140 240,168 360,150 C480,132 600,160 730,140"
          stroke-width="7" opacity="0.9"/>
    <path d="M60,-10 C80,90 70,200 110,300 C124,336 132,372 138,420"
          stroke-width="6" opacity="0.85"/>
    <path d="M420,-10 C400,90 430,180 400,260 C386,300 380,350 392,420"
          stroke-width="6" opacity="0.85"/>
    <path d="M-10,250 C110,238 220,258 330,244 C450,228 580,252 730,236"
          stroke-width="6" opacity="0.8"/>
    <path d="M250,40 C300,110 290,190 330,250" stroke-width="4" opacity="0.75"/>
    <path d="M520,30 C500,110 540,180 510,250 C498,286 502,340 520,420"
          stroke-width="4" opacity="0.7"/>
  </g>

  <!-- 800 米模糊範圍：先畫水彩暈，再疊虛線圓 -->
  <circle cx="360" cy="200" r="118" fill="url(#haze)"/>
  <circle cx="360" cy="200" r="118" fill="none"
          stroke="#4E7A60" stroke-width="2.6"
          stroke-dasharray="7 8" opacity="0.72"/>

  <!-- 中心標示 -->
  <text x="360" y="194" text-anchor="middle"
        font-family="'Noto Serif TC','Songti TC',serif"
        font-size="27" font-weight="700" fill="#2F4A38"
        opacity="0.92">元朗</text>
  <text x="360" y="226" text-anchor="middle"
        font-family="'Noto Sans TC',sans-serif"
        font-size="14.5" letter-spacing="1" fill="#4E7A60"
        opacity="0.85">約 800 米模糊範圍</text>

  <!-- 指北針（右上） -->
  <g transform="translate(662,58)">
    <circle r="27" fill="#FDFBF3" stroke="#C7C0A9" stroke-width="1.6" opacity="0.96"/>
    <path d="M0,-18 L6.5,7 L0,2.5 L-6.5,7 Z" fill="#5E8068"/>
    <path d="M0,-18 L6.5,7 L0,2.5 Z" fill="#3F6248"/>
    <text x="0" y="-31" text-anchor="middle"
          font-family="'Noto Sans TC',sans-serif"
          font-size="16" font-weight="700" fill="#5E8068">N</text>
  </g>

  <!-- 比例尺（右下）：0 —— 1 —— 2 公里 -->
  <g transform="translate(524,338)" font-family="'Noto Sans TC',sans-serif" fill="#5E6A5A">
    <line x1="0" y1="14" x2="150" y2="14" stroke="#4C5A4E" stroke-width="3.4"/>
    <line x1="0" y1="7" x2="0" y2="21" stroke="#4C5A4E" stroke-width="3.4"/>
    <line x1="75" y1="9" x2="75" y2="19" stroke="#4C5A4E" stroke-width="2.4"/>
    <line x1="150" y1="7" x2="150" y2="21" stroke="#4C5A4E" stroke-width="3.4"/>
    <text x="0" y="40" text-anchor="middle" font-size="15">0</text>
    <text x="75" y="40" text-anchor="middle" font-size="15">1</text>
    <text x="150" y="40" text-anchor="middle" font-size="15">2</text>
    <text x="176" y="40" text-anchor="end" font-size="15">公里</text>
  </g>
</svg>
