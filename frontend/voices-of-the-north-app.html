<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E6">
  <meta name="description" content="Voices of the North 北部都會區·鄉村故事館 — 聽見長者故事，保存地方記憶。">
  <title>Voices of the North · 北部都會區鄉村故事館</title>

  <link rel="icon" type="image/png" href="assets/app-icon.png">
  <link rel="apple-touch-icon" href="assets/app-icon.png">

  <!-- 清洁 CDN 引用，杜绝 Markdown 转义错误 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --ivory: #F6F1E6;
      --ivory-deep: #EFE8D7;
      --cream: #FDFBF4;
      --frame: #E4DECE;
      --forest: #2C5742;
      --forest-deep: #21453A;
      --forest-rich: #31604A;
      --jade: #7FA68C;
      --terracotta: #B65D3A;
      --terracotta-dark: #9E4A28;
      --gold: #C98A2C;
      --ink: #1F2922;
      --ink-muted: #526357;
      --ink-subtle: #839488;
      --card-bg: rgba(253, 251, 244, 0.94);
      --font-serif: "Noto Serif TC", serif;
      --font-sans: "Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: #D8D2C2;
      font-family: var(--font-sans);
      color: var(--ink);
      display: flex; justify-content: center; min-height: 100vh;
    }

    .app-viewport {
      width: 100%; max-width: 440px; min-height: 100vh;
      background-color: var(--ivory);
      position: relative; display: flex; flex-direction: column;
      box-shadow: 0 0 40px rgba(0,0,0,0.12);
      padding-bottom: 70px;
    }

    .vtn-view { display: none !important; }
    .vtn-view.is-active { display: block !important; }

    /* 顶部导航 */
    .top-header {
      background: var(--forest);
      color: #FFF;
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .top-header h1 {
      font-size: 16px; margin: 0; font-family: var(--font-serif);
      letter-spacing: 0.5px;
    }

    /* 卡片通用样式 */
    .content-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      margin: 14px;
      border: 1px solid var(--frame);
      box-shadow: 0 4px 16px rgba(44,87,66,0.06);
    }

    /* 录音与控制台 */
    .rec-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: none; outline: none;
      background: var(--terracotta);
      color: #FFF; font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      margin: 20px auto;
      box-shadow: 0 6px 20px rgba(182,93,58,0.4);
      cursor: pointer; transition: all 0.2s;
    }
    .rec-btn.recording {
      background: #D9383A;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .qa-card {
      background: var(--cream);
      border-radius: 10px;
      padding: 12px; margin-bottom: 10px;
      border-left: 4px solid var(--forest);
    }
    .qa-time {
      font-size: 11px; color: var(--gold); font-weight: bold;
    }

    /* 底部导航栏 */
    .bottom-bar {
      position: fixed; bottom: 0; width: 100%; max-width: 440px;
      height: 64px; background: #FFF;
      display: flex; border-top: 1px solid var(--frame);
      z-index: 100;
    }
    .bottom-nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--ink-subtle); text-decoration: none; font-size: 11px;
    }
    .bottom-nav-item i { font-size: 18px; margin-bottom: 3px; }
    .bottom-nav-item.active { color: var(--forest); font-weight: bold; }
  </style>
</head>
<body>

<div class="app-viewport">
  <div class="top-header">
    <h1><i class="fa-solid fa-landmark me-2"></i>北部都會區 · 鄉村故事館</h1>
    <span class="badge bg-light text-dark" id="statusBadge" style="font-size:10px;">在線</span>
  </div>

  <!-- 主页 View -->
  <main id="view-home" class="vtn-view is-active">
    <div class="content-box">
      <h2 style="font-family:var(--font-serif); font-size:20px; color:var(--forest);">留住村落嘅聲音</h2>
      <p style="font-size:13px; color:var(--ink-muted);">原音為本 · 即時粵語轉寫 · 自動出處時間戳</p>
      <div style="background:var(--ivory-deep); padding:14px; border-radius:12px; margin-top:10px;">
        <div style="font-weight:bold; font-size:14px;">元朗 · 村落晨光</div>
        <div style="font-size:12px; color:var(--ink-muted); margin-bottom:8px;">真實訪談錄音示範</div>
        <audio id="demoAudio" controls style="width:100%; height:36px;">
          <source src="assets/interview-story.mp4" type="audio/mp4">
          <source src="assets/demo-story.m4a" type="audio/mp4">
          <source src="Demo Story.wav" type="audio/wav">
          瀏覽器不支援音訊播放
        </audio>
        <button class="btn btn-sm btn-outline-success mt-2 w-100" onclick="runDemoPipeline()">
          <i class="fa-solid fa-play me-1"></i>用示範音訊試跑完整整理流程
        </button>
      </div>
    </div>

    <div class="content-box text-center">
      <h3 style="font-size:16px;">立即現場記錄口述歷史</h3>
      <p style="font-size:12px; color:var(--ink-muted);">支持即錄即轉，不添枝加葉，忠實呈現長者原聲。</p>
      <button class="btn btn-success px-4 py-2" onclick="switchToView('record')">
        <i class="fa-solid fa-microphone me-2"></i>前往錄音室
      </button>
    </div>
  </main>

  <!-- 录音 View -->
  <section id="view-record" class="vtn-view">
    <div class="content-box text-center">
      <h2 style="font-size:18px; font-family:var(--font-serif);">現場故事採集</h2>
      <div id="recTimer" style="font-size:28px; font-family:monospace; margin:10px 0; color:var(--forest);">00:00</div>
      
      <button id="mainRecBtn" class="rec-btn" onclick="toggleRecording()">
        <i class="fa-solid fa-microphone"></i>
      </button>
      
      <div id="recStatus" style="font-size:13px; color:var(--ink-muted);">點擊按鈕開始講述</div>

      <div class="mt-3 d-flex gap-2 justify-content-center">
        <button id="uploadBtn" class="btn btn-primary btn-sm px-3" style="display:none;" onclick="uploadCurrentAudio()">
          <i class="fa-solid fa-cloud-arrow-up me-1"></i>上傳並轉寫
        </button>
        <button id="cancelBtn" class="btn btn-outline-secondary btn-sm px-3" style="display:none;" onclick="resetRecording()">
          重錄
        </button>
      </div>
    </div>

    <!-- 转写结果展示区 -->
    <div id="resultBox" class="content-box" style="display:none;">
      <h3 style="font-size:15px; border-bottom:1px solid var(--frame); padding-bottom:6px;">整理後文字稿</h3>
      <div id="formalText" style="font-size:14px; line-height:1.7; margin:10px 0; color:var(--ink);"></div>

      <h4 style="font-size:13px; color:var(--ink-muted); margin-top:14px;">原始粵語逐詞辨識</h4>
      <div id="rawWords" style="font-size:12px; color:var(--ink-subtle); line-height:1.6; word-break:break-all;"></div>

      <div id="qaContainer" class="mt-3">
        <h4 style="font-size:13px; color:var(--forest);"><i class="fa-solid fa-circle-question me-1"></i>提煉問答索引</h4>
        <div id="qaList"></div>
      </div>
    </div>
  </section>

  <!-- 底部固定导航 -->
  <nav class="bottom-bar">
    <a href="#home" class="bottom-nav-item active" onclick="switchToView('home')">
      <i class="fa-solid fa-house"></i>主頁
    </a>
    <a href="#record" class="bottom-nav-item" onclick="switchToView('record')">
      <i class="fa-solid fa-microphone"></i>錄音
    </a>
  </nav>
</div>

<script>
  var mediaRecorder = null;
  var audioChunks = [];
  var recTimerInterval = null;
  var recSeconds = 0;
  var currentAudioBlob = null;

  function switchToView(viewName) {
    document.querySelectorAll('.vtn-view').forEach(function(el) { el.classList.remove('is-active'); });
    document.querySelectorAll('.bottom-nav-item').forEach(function(el) { el.classList.remove('active'); });

    var target = document.getElementById('view-' + viewName);
    if (target) target.classList.add('is-active');

    var navTarget = document.querySelector('a[href="#' + viewName + '"]');
    if (navTarget) navTarget.classList.add('active');
  }

  // 监听 Hash 路由变化，防止直接访问或空白
  window.addEventListener('hashchange', function() {
    var h = (location.hash || '#home').replace('#', '');
    switchToView(h);
  });
  if (location.hash) {
    switchToView(location.hash.replace('#', ''));
  }

  // 录音逻辑
  async function toggleRecording() {
    var btn = document.getElementById('mainRecBtn');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      clearInterval(recTimerInterval);
      btn.classList.remove('recording');
      btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
      document.getElementById('recStatus').innerText = '錄音完畢，請確認上傳';
      document.getElementById('uploadBtn').style.display = 'inline-block';
      document.getElementById('cancelBtn').style.display = 'inline-block';
    } else {
      try {
        var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/mp4';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });

        mediaRecorder.ondataavailable = function(e) {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = function() {
          currentAudioBlob = new Blob(audioChunks, { type: mime });
        };

        mediaRecorder.start();
        recSeconds = 0;
        document.getElementById('recTimer').innerText = '00:00';
        recTimerInterval = setInterval(function() {
          recSeconds++;
          var m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
          var s = String(recSeconds % 60).padStart(2, '0');
          document.getElementById('recTimer').innerText = m + ':' + s;
        }, 1000);

        btn.classList.add('recording');
        btn.innerHTML = '<i class="fa-solid fa-stop"></i>';
        document.getElementById('recStatus').innerText = '正在傾聽長者講述...';
        document.getElementById('uploadBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'none';
      } catch (err) {
        alert('請允許麥克風權限以進行錄音：' + err.message);
      }
    }
  }

  function resetRecording() {
    currentAudioBlob = null;
    recSeconds = 0;
    document.getElementById('recTimer').innerText = '00:00';
    document.getElementById('recStatus').innerText = '點擊按鈕開始講述';
    document.getElementById('uploadBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  // 上传并转写真实音频
  async function uploadCurrentAudio() {
    if (!currentAudioBlob) return;
    document.getElementById('recStatus').innerText = '語音轉寫及書面整理中...';
    var fd = new FormData();
    fd.append('file', currentAudioBlob, 'recording.mp4');

    try {
      var res = await fetch('/api/process', { method: 'POST', body: fd });
      if (!res.ok) throw new Error('伺服器處理失敗 (HTTP ' + res.status + ')');
      var data = await res.json();
      renderResult(data);
      document.getElementById('recStatus').innerText = '轉寫完成！';
    } catch (e) {
      alert('處理失敗：' + e.message);
      document.getElementById('recStatus').innerText = '出現狀況，請重試';
    }
  }

  // 运行示范故事试跑
  async function runDemoPipeline() {
    switchToView('record');
    document.getElementById('recStatus').innerText = '正在處理示範故事音訊...';
    try {
      var res = await fetch('/api/process', { method: 'POST' });
      if (!res.ok) throw new Error('示範流程伺服器回應異常');
      var data = await res.json();
      renderResult(data);
      document.getElementById('recStatus').innerText = '示範轉寫完成！';
    } catch (e) {
      alert('試跑失敗：' + e.message);
      document.getElementById('recStatus').innerText = '請先確認後端服務是否已就緒';
    }
  }

  function renderResult(data) {
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('formalText').innerText = (data.llm_result && data.llm_result.formal_text) || data.raw_text || '（無內容）';
    
    // 渲染逐词时间戳
    if (data.words && data.words.length > 0) {
      var wordsHtml = data.words.map(function(w) {
        return '<span class="badge bg-light text-dark me-1 mb-1 border" title="' + w.start + 's - ' + w.end + 's">' + w.word + '</span>';
      }).join('');
      document.getElementById('rawWords').innerHTML = wordsHtml;
    } else {
      document.getElementById('rawWords').innerText = data.raw_text || '無逐詞數據';
    }

    // 渲染提炼问答
    var qaList = (data.llm_result && data.llm_result.qa_list) || [];
    var qaBox = document.getElementById('qaList');
    qaBox.innerHTML = '';
    if (qaList.length === 0) {
      qaBox.innerHTML = '<div style="font-size:12px; color:var(--ink-subtle);">（口述內容較短，未提煉問答）</div>';
    } else {
      qaList.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'qa-card';
        card.innerHTML = '<div class="qa-time"><i class="fa-regular fa-clock me-1"></i>' + (item.timestamp || 0) + 's</div>' +
                         '<div style="font-weight:bold; font-size:13px; margin:2px 0;">' + item.question + '</div>' +
                         '<div style="font-size:12px; color:var(--ink-muted);">' + item.answer + '</div>';
        qaBox.appendChild(card);
      });
    }
  }
</script>
</body>
</html>
